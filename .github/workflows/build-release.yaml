name: Build Old Tizen widget

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: |
          npm --prefix mods install
          npm --prefix legacy install
      - name: Test the widget
        run: npm --prefix legacy test
      - name: Build the unsigned release package
        run: npm --prefix legacy run build
      - name: Upload package requiring signing
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-TV-Plus
          path: |
            artifacts/YouTube-TV-Plus-unsigned.wgt
            artifacts/YouTube-TV-Plus.zip
          if-no-files-found: error
